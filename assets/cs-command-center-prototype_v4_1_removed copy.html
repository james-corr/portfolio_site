<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0B10; --panel:#11131C; --card:#181B27; --border:#232636;
  --t1:#E8EAF2; --t2:#8B91A7; --t3:#565C73;
  --red:#F0564A; --amber:#E8A33D; --green:#3DD6A3; --slate:#6B7280; --violet:#7B6CF6;
  --mono:'JetBrains Mono',ui-monospace,monospace; --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--t1);font-family:var(--sans);font-size:14px;line-height:1.45}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:#2a2e40;border-radius:4px}::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
#shell{display:flex;min-height:100vh}
#rail{width:64px;flex:none;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px;position:sticky;top:0;height:100vh}
#rail .logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--violet),#4a3fd4);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:13px;margin-bottom:14px}
.nav-btn{width:44px;height:44px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--t3)}
.nav-btn svg{width:18px;height:18px}
.nav-btn span{font-family:var(--mono);font-size:7.5px;letter-spacing:.08em;text-transform:uppercase}
.nav-btn:hover{color:var(--t2);background:#161927}
.nav-btn.active{color:var(--violet);background:rgba(123,108,246,.12)}
#main{flex:1;min-width:0;padding:28px 36px 72px;max-width:1240px}

/* ---------- primitives ---------- */
.mono-label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--t3)}
.mono-sub{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--t2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.dot.red{background:var(--red)} .dot.amber{background:var(--amber)} .dot.green{background:var(--green)} .dot.unscored{background:var(--slate)}
.chip{display:inline-flex;align-items:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:2.5px 7px;border-radius:4px;border:1px solid var(--border);color:var(--t2);white-space:nowrap}
.chip.red{color:var(--red);border-color:rgba(240,86,74,.35);background:rgba(240,86,74,.08)}
.chip.amber{color:var(--amber);border-color:rgba(232,163,61,.35);background:rgba(232,163,61,.08)}
.chip.green{color:var(--green);border-color:rgba(61,214,163,.35);background:rgba(61,214,163,.08)}
.chip.violet{color:var(--violet);border-color:rgba(123,108,246,.4);background:rgba(123,108,246,.1)}
.chip.slate{color:var(--t2)}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--green)} .neg{color:var(--red)}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px}
.section{margin-top:34px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
h1{font-size:22px;font-weight:600;letter-spacing:-.01em}
.initials{width:22px;height:22px;border-radius:50%;background:#252941;color:var(--t1);font-family:var(--mono);font-size:9px;display:inline-flex;align-items:center;justify-content:center;flex:none}

/* ---------- briefing ---------- */
.narrative{margin-top:14px;font-size:15px;line-height:1.65;color:var(--t1);max-width:860px}
.narrative b{font-weight:600}
.narrative .hl{color:var(--violet);font-weight:600}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:26px}
.stat-card{padding:18px 20px}
.stat-card .v{font-size:34px;font-weight:600;letter-spacing:-.02em;margin-top:8px}
.stat-card .sub{margin-top:6px;font-family:var(--mono);font-size:10.5px;color:var(--t3);letter-spacing:.05em;display:flex;gap:12px;align-items:center}
.ledger{margin-top:4px}
.ledger-row{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--border)}
.ledger-row:last-child{border-bottom:none}
.ledger-row .acct{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ledger-row .who{color:var(--t3);font-size:12.5px;flex:none}
.ledger-row .det{color:var(--t2);font-size:12.5px;flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ledger-row .amt{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600;flex:none}
.ledger-foot{display:flex;justify-content:space-between;padding:11px 16px;border-top:1px solid var(--border);background:rgba(123,108,246,.04)}
.risk-card{display:block;border-left:3px solid;padding:16px 18px 14px;margin-bottom:12px}
.risk-card .top{display:flex;align-items:baseline;gap:12px}
.risk-card .name{font-size:15.5px;font-weight:600}
.risk-card .arr{margin-left:auto;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.risk-card .meta{margin-top:5px}
.score-row{display:flex;align-items:center;gap:14px;margin-top:13px}
.score-big{font-family:var(--mono);font-size:20px;font-weight:600}
.comp-bars{display:flex;gap:8px;flex:1;max-width:420px}
.comp{flex:1}
.comp .bar{height:4px;border-radius:2px;background:#252941;overflow:hidden}
.comp .bar i{display:block;height:100%;border-radius:2px}
.comp .cl{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;color:var(--t3);margin-top:4px;text-transform:uppercase}
.evidence{margin-top:13px;border-top:1px dashed var(--border);padding-top:11px}
.ev-line{display:flex;gap:10px;align-items:baseline;margin-bottom:7px;font-size:13px}
.ev-line .snip{color:var(--t1)}
.ev-line .dt{font-family:var(--mono);font-size:10px;color:var(--t3);flex:none}
.why{margin-top:9px;font-size:12.5px;color:var(--t2);font-style:italic}
.expander{width:100%;text-align:center;padding:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--violet);border:1px dashed var(--border);border-radius:8px}
.expander:hover{background:rgba(123,108,246,.06)}
table{width:100%;border-collapse:collapse}
th{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;font-weight:500}
th.r,td.r{text-align:right}
td{padding:11px 14px;border-bottom:1px solid #1c1f2e;font-size:13.5px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(123,108,246,.03)}
.scroll-table{max-height:480px;overflow-y:auto}

/* ---------- performance ---------- */
.q-progress{display:flex;align-items:center;gap:16px;padding:12px 18px}
.q-progress .track{flex:1;height:4px;border-radius:2px;background:#252941;overflow:hidden}
.q-progress .track i{display:block;height:100%;background:var(--violet)}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.kpi{padding:17px 19px}
.kpi .v{font-size:30px;font-weight:600;letter-spacing:-.02em;margin-top:7px}
.kpi.small .v{font-size:23px}
.kpi .goal{margin-top:5px;font-family:var(--mono);font-size:10.5px;color:var(--t3);letter-spacing:.04em}
.kpi .track{height:4px;border-radius:2px;background:#252941;margin-top:10px;overflow:hidden}
.kpi .track i{display:block;height:100%;border-radius:2px}
.seg-toggle{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.seg-toggle button{padding:6px 13px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3)}
.seg-toggle button.active{background:rgba(123,108,246,.14);color:var(--violet)}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--t2)}
th.sorted{color:var(--violet)}
.vsbar{display:flex;align-items:center;gap:9px;min-width:130px}
.vsbar .track{flex:1;height:4px;border-radius:2px;background:#252941;overflow:hidden}
.vsbar .track i{display:block;height:100%;border-radius:2px;background:var(--violet)}
.strip{margin-top:10px}
.strip .bar{display:flex;height:26px;border-radius:5px;overflow:hidden;border:1px solid var(--border)}
.strip .bar i{display:block;height:100%}
.strip .legend{display:flex;gap:20px;margin-top:9px;flex-wrap:wrap}
.strip .legend span{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--t2)}

/* ---------- meetings ---------- */
.gap-strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.gap-card{flex:none;width:250px;padding:14px 16px;border-top:2px solid}
.gap-card .nm{font-weight:600;font-size:13.5px;display:flex;gap:8px;align-items:center}
.gap-card .row{display:flex;justify-content:space-between;margin-top:7px;font-size:12px;color:var(--t2)}
.gap-card .rule{margin-top:10px}
.gap-card .sched{margin-top:11px;width:100%;padding:6px;border:1px solid rgba(123,108,246,.4);border-radius:5px;color:var(--violet);font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.gap-card .sched:hover{background:rgba(123,108,246,.1)}
.filters{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.fchip{padding:5px 11px;border:1px solid var(--border);border-radius:14px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--t2);display:inline-flex;gap:7px;align-items:center}
.fchip:hover{border-color:#33384e}
.fchip.active{border-color:var(--violet);color:var(--violet);background:rgba(123,108,246,.1)}
.fchip .cnt{color:var(--t3);font-size:9px}
.cal-head{display:flex;align-items:center;gap:14px;margin-top:18px}
.cal-head .wk{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--t1)}
.cal-nav{width:28px;height:28px;border:1px solid var(--border);border-radius:6px;color:var(--t2);font-size:13px}
.cal-nav:hover{border-color:var(--violet);color:var(--violet)}
.summary-bar{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:10px 16px;margin-top:12px}
.summary-bar .s{font-family:var(--mono);font-size:11px;color:var(--t2);letter-spacing:.04em}
.summary-bar .s b{color:var(--t1);font-weight:600}
.cal{display:grid;grid-template-columns:46px repeat(5,1fr);margin-top:12px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--panel)}
.cal .corner{border-bottom:1px solid var(--border)}
.cal .dayhead{padding:9px 10px;border-bottom:1px solid var(--border);border-left:1px solid var(--border)}
.cal .dayhead .dnum{font-size:16px;font-weight:600;margin-top:2px}
.cal .dayhead.today .dnum{color:var(--violet)}
.timecol{position:relative}
.timecol .tick{position:absolute;right:7px;transform:translateY(-50%);font-family:var(--mono);font-size:9px;color:var(--t3)}
.daycol{position:relative;border-left:1px solid var(--border);background-image:repeating-linear-gradient(to bottom,transparent,transparent 51px,#1a1d2b 51px,#1a1d2b 52px)}
.mblock{position:absolute;left:3px;right:3px;border-radius:5px;background:#1d2133;border:1px solid #2a2e44;border-left:3px solid;padding:4px 7px;overflow:hidden;cursor:pointer;font-size:11px}
.mblock:hover{filter:brightness(1.25);z-index:5}
.mblock .mt{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:8.5px;color:var(--t3)}
.mblock .ma{font-weight:600;font-size:11.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--t1)}
.mblock .mc{color:var(--t3);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mblock.internal{opacity:.45;border-left-color:var(--slate)}
.mblock .mark{position:absolute;top:3px;right:5px;font-size:9px;font-family:var(--mono)}
.mblock .riskdot{position:absolute;bottom:5px;right:6px}
/* drawer */
#drawer-veil{position:fixed;inset:0;background:rgba(5,6,10,.55);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
#drawer-veil.open{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:-420px;width:400px;height:100vh;background:var(--panel);border-left:1px solid var(--border);z-index:41;transition:right .2s ease;overflow-y:auto;padding:24px}
#drawer.open{right:0}
#drawer h3{font-size:16px;font-weight:600;margin-top:4px}
.d-sec{margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.d-kv{display:flex;justify-content:space-between;margin-top:8px;font-size:13px}
.d-kv .k{color:var(--t3)} .d-kv .v{font-variant-numeric:tabular-nums}
.att{display:flex;gap:8px;align-items:center;margin-top:7px;font-size:13px}
.att .exec{color:var(--violet);font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase}
.ctx-line{margin-top:9px;font-size:12.5px;color:var(--t2);display:flex;gap:9px;align-items:baseline}
.prep-btn{margin-top:14px;width:100%;padding:9px;border:1px solid rgba(123,108,246,.5);border-radius:6px;color:var(--violet);font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.prep-btn:hover{background:rgba(123,108,246,.1)}
.prep-out{margin-top:12px;padding:13px 15px;background:var(--card);border:1px solid var(--border);border-radius:7px;font-size:13px;line-height:1.6;color:var(--t1);display:none}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card);border:1px solid var(--violet);color:var(--t1);padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:all .2s;z-index:60;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty-green{padding:20px;text-align:center;color:var(--green);font-size:13.5px;border:1px dashed rgba(61,214,163,.4);border-radius:8px}
.chip.mock{color:var(--amber);border:1px dashed rgba(232,163,61,.5);background:rgba(232,163,61,.05);cursor:pointer}
.chip.mock:hover{background:rgba(232,163,61,.14)}
.chip.real{color:var(--green);border-color:rgba(61,214,163,.35);background:rgba(61,214,163,.05)}
.fgroup{display:flex;align-items:flex-start;gap:14px;border:1px solid var(--border);border-radius:8px;padding:10px 14px;background:var(--panel)}
.fgroup + .fgroup{margin-top:8px}
.fgroup-label{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);flex:none;width:92px;padding-top:6px;border-right:1px solid var(--border);margin-right:2px}
.fgroup .fchips{display:flex;flex-wrap:wrap;gap:7px;flex:1}
.ctl-chip{padding:5px 11px;border:1px solid var(--border);border-radius:6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3)}
.ctl-chip:hover{border-color:#33384e;color:var(--t2)}
.ctl-chip.on{border-color:var(--violet);color:var(--violet);background:rgba(123,108,246,.1)}
.method-card{padding:18px 22px;margin-top:14px}
.method-card h2{font-size:15px;font-weight:600;margin-bottom:10px}
.method-card p{color:var(--t2);font-size:13.5px;line-height:1.6;margin-top:8px}
.method-card code{font-family:var(--mono);font-size:12px;color:var(--violet);background:rgba(123,108,246,.08);padding:1px 5px;border-radius:4px}
.formula{font-family:var(--mono);font-size:12.5px;color:var(--t1);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px 16px;margin-top:10px;line-height:1.7}
@media (max-width:900px){.stats-row,.kpi-grid{grid-template-columns:1fr 1fr}}

/* ---------- sentiment / signals (v4) ---------- */
.chip.gong{color:var(--violet);border-color:rgba(123,108,246,.35);background:rgba(123,108,246,.08)}
.chip.human{color:#5CA8F5;border-color:rgba(92,168,245,.4);background:rgba(92,168,245,.08)}
.chip.flag{color:var(--red);border-color:rgba(240,86,74,.5);background:rgba(240,86,74,.1);font-weight:600}
.sent-pos{color:var(--green)} .sent-neu{color:var(--amber)} .sent-neg{color:var(--red)}
.dot.pos{background:var(--green)} .dot.neu{background:var(--amber)} .dot.neg{background:var(--red)}
/* combined sentiment badge (combined big, two sub-scores under it) */
.sent-badge{display:flex;align-items:center;gap:14px}
.sent-badge .combined{display:flex;flex-direction:column;align-items:center;min-width:64px}
.sent-badge .combined .n{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1}
.sent-badge .combined .l{font-family:var(--mono);font-size:8px;letter-spacing:.14em;color:var(--t3);margin-top:3px;text-transform:uppercase}
.sent-subs{display:flex;flex-direction:column;gap:6px}
.sent-sub{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--t3)}
.sent-sub .lab{width:52px;flex:none}
.sent-sub .tk{width:74px;height:4px;border-radius:2px;background:#252941;overflow:hidden;flex:none}
.sent-sub .tk i{display:block;height:100%;border-radius:2px}
.sent-sub .val{font-weight:600;width:22px;text-align:right}
/* sparkline */
.spark{display:inline-flex;align-items:center;gap:7px}
.spark svg{display:block}
.spark .trend{font-family:var(--mono);font-size:9px;letter-spacing:.06em}
/* flag-to-leadership hero cards */
.flag-card{display:block;border-left:3px solid var(--red);padding:15px 18px 13px;margin-bottom:11px}
.flag-card .top{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.flag-card .name{font-size:15px;font-weight:600}
.flag-card .arr{margin-left:auto;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.flag-card .meta{margin-top:5px}
.flag-card .body{display:flex;gap:20px;align-items:center;margin-top:12px;flex-wrap:wrap}
.flag-card .note{flex:1;min-width:220px;font-size:13px;color:var(--t1);border-left:2px solid var(--border);padding-left:12px}
.flag-card .note .by{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--t3);margin-top:5px;text-transform:uppercase}
/* signals feed */
.feed-row{display:flex;gap:12px;align-items:baseline;padding:11px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.feed-row:last-child{border-bottom:none}
.feed-row:hover{background:rgba(123,108,246,.03)}
.feed-row .fr-date{font-family:var(--mono);font-size:10px;color:var(--t3);width:46px;flex:none}
.feed-row .fr-acct{font-weight:500;width:172px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed-row .fr-snip{color:var(--t2);font-size:13px;flex:1;min-width:120px}
.feed-row .fr-chips{display:flex;gap:6px;flex:none;align-items:center}
/* sentiment board table extras */
.sent-cell{display:flex;align-items:center;gap:8px}
.mini-sub{display:inline-flex;gap:6px;font-family:var(--mono);font-size:9px;color:var(--t3)}
/* v4.1 decision layer — the ask */
.ask{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px;margin-top:11px;padding:9px 12px;border-radius:7px;font-size:13px;background:rgba(240,86,74,.07);border:1px solid rgba(240,86,74,.28)}
.ask.soft{background:rgba(232,163,61,.06);border-color:rgba(232,163,61,.28)}
.ask .ask-tag{font-family:var(--mono);font-size:9px;letter-spacing:.12em;font-weight:600;color:var(--red);flex:none;text-transform:uppercase}
.ask.soft .ask-tag{color:var(--amber)}
.ask b{font-weight:600;color:var(--t1)}
.ask .ask-meta{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;color:var(--t3);text-transform:uppercase;margin-left:auto}
.watch-strip{margin-top:10px}
.watch-row{display:flex;align-items:center;gap:11px;padding:10px 14px;border:1px solid var(--border);border-left:3px solid var(--slate);border-radius:7px;margin-bottom:8px;cursor:pointer;font-size:13px}
.watch-row:hover{background:var(--panel-2,rgba(255,255,255,.02))}
.watch-row .w-name{font-weight:600}
.watch-row .w-snip{color:var(--t2);flex:1;min-width:180px}

const D = window.DATA;
const TODAY = new Date(D.mockToday + 'T07:00:00');
const DAY = 86400000;
const RISK_COLOR = { red: 'var(--red)', amber: 'var(--amber)', green: 'var(--green)', unscored: 'var(--slate)' };
const TYPE_COLOR = { 'QBR': 'var(--violet)', 'Renewal Negotiation': '#5CA8F5', 'Escalation': 'var(--red)', 'Check-in': 'var(--green)', 'Onboarding': 'var(--amber)', 'Internal': 'var(--slate)' };

/* ---------- indexes ---------- */
const acctById = {}; D.accounts.forEach(a => acctById[a.id] = a);
const csmById = {}; D.csms.forEach(c => csmById[c.id] = c);
const dealById = {}; D.deals.forEach(x => dealById[x.id] = x);
const sigsByAcct = {}; D.signals.forEach(s => (sigsByAcct[s.accountId] = sigsByAcct[s.accountId] || []).push(s));
Object.values(sigsByAcct).forEach(l => l.sort((a, b) => b.callDate.localeCompare(a.callDate)));
const openDeals = D.deals.filter(x => x.status === 'open');
const csmFor = d => csmById[d.ownerActive && csmById[slug(d.ownerName)] ? slug(d.ownerName) : 'house'] || csmById.house;
function slug(n) { return n.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }

/* ================= SENTIMENT ENGINE (v4) =================
   Sentiment is fed by two provenances:
     • GONG  — programmatic call analysis (automated signal extraction)
     • HUMAN — CSM post-meeting input (meeting type, sentiment, flag-to-leadership)
   We surface a COMBINED score first, made up of a Gong sub-score and a Human sub-score.
   The blend is a deliberate placeholder for future state — see the methodology page. */
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

/* every existing signal is a programmatic Gong signal */
D.signals.forEach(s => s.source = 'gong');

/* seeded RNG so the synthetic human layer is identical on every load */
function seed32(str) { let h = 1779033703 ^ str.length; for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } return function () { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; }; }
function isoDay(dt) { return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`; }

const MEETING_TYPES = ['Strategic touchpoint', 'Renewal conversation', 'Product roadmap', 'Escalation', 'Onboarding', 'Check-in'];
const HUMAN_TEMPLATES = {
  positive: [
    'Champion confirmed budget is locked for the renewal — no obstacles flagged.',
    'Exec sponsor thrilled with the Q2 rollout and asked about expanding to a second team.',
    'Strong QBR — they cited our support as a reason they are staying.',
    'Renewal conversation went well; verbal commit to same terms.',
    'Roadmap resonated — they want to be a design partner next release.'
  ],
  neutral: [
    'Routine check-in — no new risks, but no strong signal either way.',
    'Renewal terms still under internal review on their side.',
    'Roadmap discussion was fine; a few feature gaps noted but nothing blocking.',
    'Onboarding on track; adoption roughly where we would expect.',
    'Quiet quarter — working to re-engage the exec sponsor.'
  ],
  negative: [
    'Renewal conversation was tense — pushing hard on price and hinted at evaluating alternatives.',
    'Escalation: an unresolved data issue is eroding trust with the sponsor.',
    'Champion is leaving; the new stakeholder is skeptical of the value.',
    'Flat usage came up repeatedly — they are questioning ROI ahead of renewal.',
    'Strategic touchpoint went poorly; the exec was disengaged and non-committal.'
  ]
};
/* synthetic human-input layer — represents what CSMs submit right after a meeting */
const HUMAN = [];
let _hid = 0;
D.accounts.filter(a => a.hasOpenDeal).forEach(a => {
  const rng = seed32('human:' + a.id);
  const roll = rng();
  const n = roll < .22 ? 0 : roll < .55 ? 1 : roll < .85 ? 2 : 3;
  const dtc = a.renewalDate ? daysTo(a.renewalDate) : 999;
  for (let i = 0; i < n; i++) {
    const daysAgo = 3 + Math.floor(rng() * 74);
    const dateStr = isoDay(new Date(pdate(D.mockToday).getTime() - daysAgo * DAY));
    const r = rng();
    const sentiment = a.riskLevel === 'red' ? (r < .6 ? 'negative' : r < .85 ? 'neutral' : 'positive')
      : a.riskLevel === 'amber' ? (r < .4 ? 'negative' : r < .75 ? 'neutral' : 'positive')
        : (r < .1 ? 'negative' : r < .38 ? 'neutral' : 'positive');
    const meetingType = MEETING_TYPES[Math.floor(rng() * MEETING_TYPES.length)];
    const severity = sentiment === 'positive' ? 2 : sentiment === 'neutral' ? 0 : (rng() < .4 ? -3 : -2);
    const flaggedToLeadership = sentiment === 'negative' && (dtc <= 90 || a.arr >= 200000) && rng() < .55;
    HUMAN.push({ id: 'h' + String(++_hid).padStart(4, '0'), accountId: a.id, csmId: a.csmId, callDate: dateStr, meetingType, sentiment, severity, flaggedToLeadership, source: 'human', snippet: HUMAN_TEMPLATES[sentiment][Math.floor(rng() * HUMAN_TEMPLATES[sentiment].length)] });
  }
});
/* guarantee a compelling leadership queue: top red/amber accounts renewing ≤90d each get one flagged human note */
(function seedLeadershipFlags() {
  const flagged = new Set(HUMAN.filter(h => h.flaggedToLeadership).map(h => h.accountId));
  openDeals.filter(x => { const dt = daysTo(x.closeDate); return dt <= 90; })
    .map(x => acctById[x.accountId]).filter(a => a && (a.riskLevel === 'red' || a.riskLevel === 'amber'))
    .sort((p, q) => q.arr - p.arr)
    .forEach(a => {
      if (flagged.has(a.id) || flagged.size >= 9) return;
      const rng = seed32('lead:' + a.id);
      const daysAgo = 2 + Math.floor(rng() * 12);
      HUMAN.push({ id: 'h' + String(++_hid).padStart(4, '0'), accountId: a.id, csmId: a.csmId, callDate: isoDay(new Date(pdate(D.mockToday).getTime() - daysAgo * DAY)), meetingType: rng() < .5 ? 'Renewal conversation' : 'Escalation', sentiment: 'negative', severity: -3, flaggedToLeadership: true, source: 'human', snippet: HUMAN_TEMPLATES.negative[Math.floor(rng() * HUMAN_TEMPLATES.negative.length)] });
      flagged.add(a.id);
    });
})();

/* ================= DECISION LAYER (v4.1) =================
   The rubric's sharpest miss in v4: the readout stopped at "informed" and never
   crossed to "deciding". These are the fields a CSM would submit post-meeting that
   turn a status board into a decision board. All synthetic, seeded, stable per reload.
     • RENEWAL CONFIDENCE — the CSM's gut read on whether it renews (NOT the call mood)
     • CHAMPION READ       — strong / wobbling / gone
     • TIER                — escalate (alarm) vs watch ("a little off, context not alarm") vs none
     • THE ASK             — what leadership can do, who owns it, by when */
const LEADERS = ['Kate', 'Patrick'];
const CONF_META = { will_renew: ['Will renew', 'green'], likely: ['Likely renews', 'green'], at_risk: ['At risk', 'amber'], likely_churn: ['Likely churn', 'red'] };
const CHAMP_META = { strong: ['Champion strong', 'green'], wobbling: ['Champion wobbling', 'amber'], gone: ['Champion gone', 'red'], unknown: ['Champion unclear', 'slate'] };
const ASK_LABEL = { exec_air_cover: 'Exec air-cover on the renewal', pricing_approval: 'Pricing / discount approval', roadmap_commit: 'Roadmap commitment', exec_intro: 'Exec-to-exec intro', escalation: 'Hands-on escalation support' };
const ESCALATE_ASKS = ['exec_air_cover', 'pricing_approval', 'exec_intro', 'escalation', 'roadmap_commit'];
HUMAN.forEach(h => {
  const a = acctById[h.accountId]; if (!a) { h.tier = 'none'; h.ask = null; return; }
  const rng = seed32('dec:' + h.id);
  /* renewal confidence — anchored to sentiment, distinct from it (a calm call can still be a churn) */
  if (h.sentiment === 'positive') h.renewalConf = rng() < .75 ? 'will_renew' : 'likely';
  else if (h.sentiment === 'neutral') h.renewalConf = rng() < .58 ? 'likely' : 'at_risk';
  else h.renewalConf = (h.flaggedToLeadership && rng() < .5) ? 'likely_churn' : 'at_risk';
  /* champion read */
  if (h.sentiment === 'positive') h.champion = rng() < .82 ? 'strong' : 'wobbling';
  else if (h.sentiment === 'neutral') h.champion = rng() < .5 ? 'strong' : (rng() < .6 ? 'wobbling' : 'unknown');
  else h.champion = rng() < .45 ? 'gone' : 'wobbling';
  /* tier: escalate if formally flagged; watch if off but not alarm-worthy; else none */
  if (h.flaggedToLeadership) h.tier = 'escalate';
  else if (h.sentiment === 'negative' || (h.sentiment === 'neutral' && h.renewalConf === 'at_risk' && rng() < .7)) h.tier = 'watch';
  else h.tier = 'none';
  /* the ask */
  if (h.tier === 'escalate') {
    h.ask = { need: ESCALATE_ASKS[Math.floor(rng() * ESCALATE_ASKS.length)], owner: LEADERS[Math.floor(rng() * LEADERS.length)], by: a.renewalDate || null };
  } else if (h.tier === 'watch' && rng() < .4) {
    h.ask = { need: rng() < .5 ? 'roadmap_commit' : 'pricing_approval', owner: (csmById[h.csmId] || {}).name || 'CSM', by: a.renewalDate || null, soft: true };
  } else h.ask = null;
});
/* account-level accessors — latest human read, latest open ask, watch queue */
function latestHuman(a) {
  return (sigsByAcct[a.id] || []).filter(s => s.source === 'human' && daysTo(s.callDate) >= -90)
    .sort((p, q) => q.callDate.localeCompare(p.callDate))[0] || null;
}
function openAskFor(a) {
  return (sigsByAcct[a.id] || []).filter(s => s.source === 'human' && s.ask && daysTo(s.callDate) >= -90)
    .sort((p, q) => q.callDate.localeCompare(p.callDate))[0] || null;
}
function watchAccounts() {
  const flaggedIds = new Set(leadershipFlags().map(f => f.a.id));
  const map = {};
  ALL_SIGNALS.filter(s => s.source === 'human' && s.tier === 'watch' && daysTo(s.callDate) >= -90).forEach(s => {
    const a = acctById[s.accountId]; if (!a || flaggedIds.has(a.id)) return;
    if (!a.renewalDate || daysTo(a.renewalDate) > 90) return; // keep the ≤90-day framing
    if (!map[a.id] || s.callDate > map[a.id].sig.callDate) map[a.id] = { a, sig: s };
  });
  return Object.values(map).sort((p, q) => {
    const dp = p.a.renewalDate ? daysTo(p.a.renewalDate) : 999, dq = q.a.renewalDate ? daysTo(q.a.renewalDate) : 999;
    return dp - dq || q.a.arr - p.a.arr;
  });
}
/* decision-layer render helpers */
function confChip(k) { if (!k) return '<span class="chip slate">No read</span>'; const [l, c] = CONF_META[k]; return `<span class="chip ${c}">${l}</span>`; }
function champChip(k) { if (!k) return ''; const [l, c] = CHAMP_META[k]; return `<span class="chip ${c}">${l}</span>`; }
function askBlock(h) {
  if (!h || !h.ask) return '';
  const label = ASK_LABEL[h.ask.need] || h.ask.need;
  const by = h.ask.by ? ` · by ${fdate(h.ask.by).toUpperCase()}` : '';
  return `<div class="ask ${h.ask.soft ? 'soft' : ''}"><span class="ask-tag">${h.ask.soft ? '💡 SUGGESTED' : '🎯 THE ASK'}</span> <b>${label}</b><span class="ask-meta">OWNER ${esc(h.ask.owner).toUpperCase()}${by}</span></div>`;
}

/* rebuild the per-account signal index to fuse Gong + Human */
const ALL_SIGNALS = D.signals.concat(HUMAN);
Object.keys(sigsByAcct).forEach(k => delete sigsByAcct[k]);
ALL_SIGNALS.forEach(s => (sigsByAcct[s.accountId] = sigsByAcct[s.accountId] || []).push(s));
Object.values(sigsByAcct).forEach(l => l.sort((a, b) => b.callDate.localeCompare(a.callDate)));

/* --- scoring: 0–100, 50 = neutral --- */
function avgScore(sigs) { if (!sigs.length) return null; const avg = sigs.reduce((s, x) => s + x.severity, 0) / sigs.length; return clamp(Math.round(50 + avg * 16), 0, 100); }
function scoreFrom(sigs) { // recency-weighted headline score over trailing 90d
  const recent = sigs.filter(s => { const dt = daysTo(s.callDate); return dt >= -90 && dt <= 0; });
  if (!recent.length) return null;
  let ws = 0, w = 0;
  recent.forEach(s => { const age = -daysTo(s.callDate); const rec = age <= 14 ? 1.6 : age <= 45 ? 1 : .6; ws += s.severity * rec; w += rec; });
  return clamp(Math.round(50 + (ws / w) * 16), 0, 100);
}
function sentiment(a) {
  const sigs = sigsByAcct[a.id] || [];
  const gongSigs = sigs.filter(s => s.source === 'gong');
  const humanSigs = sigs.filter(s => s.source === 'human');
  const gong = scoreFrom(gongSigs), human = scoreFrom(humanSigs);
  let combined = (gong != null && human != null) ? Math.round((gong + human) / 2) : (gong != null ? gong : human);
  return { gong, human, combined, gongN: gongSigs.length, humanN: humanSigs.length };
}
function sentLabel(v) { return v == null ? ['No signal', '', 'var(--t3)'] : v >= 60 ? ['Positive', 'pos', 'var(--green)'] : v < 45 ? ['Negative', 'neg', 'var(--red)'] : ['Neutral', 'neu', 'var(--amber)']; }
const sentColor = v => sentLabel(v)[2];
const sentKey = v => v == null ? 'none' : v >= 60 ? 'pos' : v < 45 ? 'neg' : 'neu';

/* --- 90-day trend sparkline (six 15-day buckets, fused Gong+Human) --- */
function sentTrendVals(a) {
  const sigs = sigsByAcct[a.id] || [];
  const out = [];
  for (let b = 5; b >= 0; b--) { const lo = -(b + 1) * 15, hi = -b * 15; out.push(avgScore(sigs.filter(s => { const dt = daysTo(s.callDate); return dt > lo && dt <= hi; }))); }
  return out;
}
function sparkSVG(raw) {
  const vals = raw.slice();
  let last = null; for (let i = 0; i < vals.length; i++) { if (vals[i] == null) vals[i] = last; else last = vals[i]; }
  const first = vals.find(v => v != null); if (first == null) return { svg: '', dir: null };
  for (let i = 0; i < vals.length; i++) if (vals[i] == null) vals[i] = first;
  const w = 66, h = 20, pad = 2.5, n = vals.length;
  const x = i => pad + i * ((w - 2 * pad) / (n - 1));
  const y = v => pad + (1 - v / 100) * (h - 2 * pad);
  const pts = vals.map((v, i) => [x(i), y(v)]);
  const delta = vals[n - 1] - vals[0];
  const dir = delta > 4 ? 'up' : delta < -4 ? 'down' : 'flat';
  const col = dir === 'up' ? 'var(--green)' : dir === 'down' ? 'var(--red)' : 'var(--slate)';
  const line = `<polyline points="${pts.map(p => p.map(z => z.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>`;
  const dot = `<circle cx="${pts[n - 1][0].toFixed(1)}" cy="${pts[n - 1][1].toFixed(1)}" r="2.2" fill="${col}"/>`;
  return { svg: `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${line}${dot}</svg>`, dir, col };
}
function sparkCell(a) {
  const t = sparkSVG(sentTrendVals(a));
  if (!t.svg) return '<span class="mono-sub" style="font-size:10px;color:var(--t3)">no trend</span>';
  const arrow = t.dir === 'up' ? '▲' : t.dir === 'down' ? '▼' : '▬';
  return `<span class="spark">${t.svg}<span class="trend" style="color:${t.col}">${arrow}</span></span>`;
}

/* --- combined-first sentiment badge (Gong + Human sub-scores beneath) --- */
function sentBadge(a) {
  const s = sentiment(a);
  const sub = (lab, v) => `<div class="sent-sub"><span class="lab">${lab}</span><span class="tk"><i style="width:${v == null ? 0 : v}%;background:${sentColor(v)}"></i></span><span class="val" style="color:${sentColor(v)}">${v == null ? '—' : v}</span></div>`;
  return `<div class="sent-badge">
    <div class="combined"><span class="n" style="color:${sentColor(s.combined)}">${s.combined == null ? '—' : s.combined}</span><span class="l">Combined</span></div>
    <div class="sent-subs">${sub('Gong', s.gong)}${sub('Human', s.human)}</div>
  </div>`;
}

/* --- shared signal renderers (source-aware) --- */
function srcChip(s) { return s.source === 'human' ? '<span class="chip human">HUMAN</span>' : '<span class="chip gong">GONG</span>'; }
function typeChip(s) {
  if (s.source === 'human') { const cls = { positive: 'green', neutral: 'amber', negative: 'red' }[s.sentiment]; return `<span class="chip ${cls}">${s.meetingType}</span>`; }
  const t = s.signalType, lab = t.replace(/_/g, ' ');
  const cls = ['sentiment_positive', 'expansion_interest'].includes(t) ? 'green' : (t === 'budget_concern' || t === 'champion_change' || t === 'sentiment_negative') ? 'red' : 'amber';
  return `<span class="chip ${cls}">${lab}</span>`;
}

/* --- the renewal book leadership cares about: open deals due within 90 days (incl. overdue) --- */
function due90Rows() {
  const byAcct = {};
  openDeals.forEach(x => { if (daysTo(x.closeDate) > 90) return; const a = acctById[x.accountId]; if (!a) return; (byAcct[a.id] = byAcct[a.id] || []).push(x); });
  const rows = [];
  Object.entries(byAcct).forEach(([aid, ds]) => { ds.sort((p, q) => (q.pastDue - p.pastDue) || p.closeDate.localeCompare(q.closeDate)); rows.push({ a: acctById[aid], deal: ds[0], totalOpen: ds.length }); });
  return rows;
}
function portfolioMix() {
  const b = { pos: { v: 0, n: 0 }, neu: { v: 0, n: 0 }, neg: { v: 0, n: 0 }, none: { v: 0, n: 0 } };
  due90Rows().forEach(r => { const key = sentKey(sentiment(r.a).combined); const amt = r.deal.amount || r.a.arr; b[key].v += amt; b[key].n++; });
  return b;
}
/* leadership queue: explicit human flags first, then sharply-negative automated sentiment on ≤90d renewals */
function leadershipFlags() {
  const map = {};
  ALL_SIGNALS.filter(s => s.source === 'human' && s.flaggedToLeadership && daysTo(s.callDate) >= -90).forEach(s => {
    const a = acctById[s.accountId]; if (!a) return;
    if (!map[a.id] || s.callDate > map[a.id].sig.callDate) map[a.id] = { a, sig: s, reason: 'human' };
  });
  due90Rows().forEach(r => {
    const c = sentiment(r.a).combined;
    if (c != null && c < 40 && !map[r.a.id]) {
      const worst = (sigsByAcct[r.a.id] || []).filter(s => s.severity < 0).sort((p, q) => p.severity - q.severity)[0];
      if (worst) map[r.a.id] = { a: r.a, sig: worst, reason: 'auto' };
    }
  });
  return Object.values(map).sort((p, q) => {
    const dp = p.a.renewalDate ? daysTo(p.a.renewalDate) : 999, dq = q.a.renewalDate ? daysTo(q.a.renewalDate) : 999;
    return dp - dq || q.a.arr - p.a.arr;
  });
}
function openDealFor(a) { return (a.currentDealId && dealById[a.currentDealId]) || openDeals.filter(x => x.accountId === a.id).sort((p, q) => p.closeDate.localeCompare(q.closeDate))[0] || null; }

/* ---------- format ---------- */
function money(v, signed) {
  if (v == null) return '—';
  const sign = v < 0 ? '−' : (signed && v > 0 ? '+' : '');
  const a = Math.abs(v);
  let s;
  if (a >= 1e6) s = '$' + (a / 1e6).toFixed(1) + 'M';
  else if (a >= 1e3) s = '$' + (a / 1e3).toFixed(1) + 'K';
  else s = '$' + a.toFixed(0);
  return sign + s;
}
function pdate(s) { return new Date(s.slice(0, 10) + 'T12:00:00'); }
function fdate(s) { return pdate(s).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
function fdateY(s) { return pdate(s).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }
function daysTo(s) { return Math.round((pdate(s) - pdate(D.mockToday)) / DAY); }
function stageLabel(st) { return st.replace(/^\d+ - /, ''); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function sigChip(t) {
  const lab = t.replace(/_/g, ' ');
  const cls = ['sentiment_positive', 'expansion_interest'].includes(t) ? 'green' : (t === 'budget_concern' || t === 'champion_change') ? 'red' : 'amber';
  return `<span class="chip ${cls}">${lab}</span>`;
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- router ---------- */
const main = document.getElementById('main');
const SCREENS = {};
function navigate(route) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.route === route));
  main.innerHTML = '';
  SCREENS[route]();
  window.scrollTo(0, 0);
  location.hash = route;
}
document.querySelectorAll('.nav-btn').forEach(b => b.addEventListener('click', () => navigate(b.dataset.route)));

/* ================= BRIEFING ================= */
let riskSort = 'score', hidePastDue = false;
function atRiskAccounts() {
  const byAcct = {};
  openDeals.forEach(x => {
    const a = acctById[x.accountId];
    if (!a || (a.riskLevel !== 'red' && a.riskLevel !== 'amber')) return;
    (byAcct[a.id] = byAcct[a.id] || []).push(x);
  });
  const rows = [];
  Object.entries(byAcct).forEach(([aid, ds]) => {
    const totalOpen = ds.length;
    let pool = hidePastDue ? ds.filter(x => !x.pastDue) : ds;
    if (!pool.length) return; // hidden entirely when only past-due deals remain
    // most urgent: past-due first, then earliest close date
    pool = pool.slice().sort((p, q) => (q.pastDue - p.pastDue) || p.closeDate.localeCompare(q.closeDate));
    rows.push({ a: acctById[aid], deal: pool[0], totalOpen });
  });
  rows.sort((p, q) => {
    if (riskSort === 'score') return (q.a.riskScore - p.a.riskScore) || (daysTo(p.deal.closeDate) - daysTo(q.deal.closeDate));
    if (riskSort === 'close') return (daysTo(p.deal.closeDate) - daysTo(q.deal.closeDate)) || (q.a.riskScore - p.a.riskScore);
    return ((q.deal.amount || q.a.arr) - (p.deal.amount || p.a.arr)) || (q.a.riskScore - p.a.riskScore);
  });
  return rows;
}
function ledger24h() { return D.ledger.filter(l => daysTo(l.date) >= -1 && daysTo(l.date) <= 0); }
function ledger7d() { return D.ledger.filter(l => daysTo(l.date) >= -7 && daysTo(l.date) <= 0); }

function buildNarrative() {
  const closing7 = openDeals.filter(x => { const dt = daysTo(x.closeDate); return dt >= 0 && dt <= 7 && x.amount; })
    .sort((p, q) => p.closeDate.localeCompare(q.closeDate));
  const l24 = ledger24h();
  const net24 = l24.reduce((s, l) => s + l.deltaArr, 0);

  const parts = [];

  if (riskChange) {

    parts.push(`The most significant risk change in the last 24 hours: <b>${esc(a.name)}</b> — ${esc(riskChange.detail).toLowerCase()}.`);

  return parts.join(' ');
}

function comboChart() {
  const W = 1100, H = 260, padL = 56, padR = 16, padT = 18, padB = 34;
  const cw = W - padL - padR, ch = H - padT - padB;
  const max = Math.max(...D.chart.map(c => Math.max(c.secured, c.atRisk))) * 1.15;
  const bw = cw / D.chart.length;
  const y = v => padT + ch - (v / max) * ch;
  let bars = '', line = '', dots = '', labels = '', grid = '';
  for (let g = 0; g <= 4; g++) {
    const gy = padT + (ch / 4) * g;
    grid += `<line x1="${padL}" y1="${gy}" x2="${W - padR}" y2="${gy}" stroke="#1c1f2e"/>`;
    grid += `<text x="${padL - 8}" y="${gy + 3}" text-anchor="end" font-family="JetBrains Mono" font-size="9" fill="#565C73">${money(max * (1 - g / 4))}</text>`;
  }
  const pts = [];
  D.chart.forEach((c, i) => {
    const cx = padL + bw * i + bw / 2;
    const bx = cx - 22, bh = (c.secured / max) * ch;
    bars += `<rect x="${bx}" y="${y(c.secured)}" width="44" height="${Math.max(1, bh)}" rx="3"
      fill="${c.current ? 'var(--slate)' : 'var(--violet)'}" opacity="${c.current ? .55 : .9}">
      <title>Week of ${fdate(c.weekStart)} — secured ${money(c.secured)}</title></rect>`;
    pts.push([cx, y(c.atRisk)]);
    dots += `<circle cx="${cx}" cy="${y(c.atRisk)}" r="3.5" fill="var(--amber)"><title>Week of ${fdate(c.weekStart)} — at-risk ARR ${money(c.atRisk)}</title></circle>`;
    labels += `<text x="${cx}" y="${H - 12}" text-anchor="middle" font-family="JetBrains Mono" font-size="9" fill="${c.current ? '#8B91A7' : '#565C73'}">${fdate(c.weekStart).toUpperCase()}${c.current ? ' ·WIP' : ''}</text>`;
  });
  line = `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--amber)" stroke-width="2"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">${grid}${bars}${line}${dots}${labels}</svg>
    <div class="strip"><div class="legend" style="margin-top:2px">
      <span><span class="dot" style="background:var(--violet);border-radius:2px"></span>ARR secured (renewed + expanded) / week</span>
      <span><span class="dot amber"></span>ARR at risk (red-account open renewal ARR) <span class="chip mock" style="margin-left:4px" title="Backcast from mocked risk scores">MOCKED</span></span>
    </div></div>`;
}

function stackedStrip(title, parts) {
  const total = parts.reduce((s, p) => s + p.v, 0) || 1;
  return `<div class="section" style="margin-top:24px">
    <div class="mono-label">${title}</div>
    <div class="strip"><div class="bar">
      ${parts.map(p => `<i style="width:${(p.v / total * 100).toFixed(2)}%;background:${p.color}" title="${p.label}: ${money(p.v)}"></i>`).join('')}
    </div><div class="legend">

    ['CSM roster & books', '7 active owners from the export + an Unassigned book for deactivated owners', 'real'],
    ['Renewals/churn QTD, GRR', 'Computed from real closed deals against the Feb-start fiscal calendar', 'real'],
    ['STRAT flags, partner fields', 'Straight from the export', 'real'],
  ];
  const mocked = [
    ['Gong call signals (' + D.signals.length + ')', 'Synthetic snippets, types & severities seeded per account; recent-negative bias on troubled accounts', 'mock'],
    ['Human post-meeting input (' + HUMAN.length + ')', 'Synthetic CSM logs: meeting type · sentiment · leadership flag, seeded per account. Display-only — no capture form in this prototype', 'mock'],
    ['Decision layer (v4.1)', 'Renewal confidence, champion read, watch-vs-escalate tier, and the ask (need · owner · by-when) — synthetic CSM judgment seeded per meeting. These are the fields that move the readout from informed to deciding', 'mock'],
    ['Combined sentiment score', 'Placeholder blend of the Gong and human sub-scores (0–100); exact weighting deferred to future state', 'mock'],
    ['Support summaries', 'Open tickets, escalations, days-since-last-touch — synthetic per account', 'mock'],
    ['Risk scores & levels', 'Computed by the real engine below — but over partly mocked inputs', 'mock'],
    ['Close-date slips (6)', 'previousCloseDate is synthetic; HubSpot export has no field history', 'mock'],
    ['Expansions (5 · $440K QTD)', 'Synthetic ledger events + paired expansion-interest signals', 'mock'],
    ['On-time renewal rate', 'Mocked — original close dates are not in the export', 'mock'],
    ['Goals & churn allowance', 'GRR 92% / NRR 105% / expansion $500K / churn allowance $1.0M are assumptions', 'mock'],
    ['People names in snippets', 'All exec & champion names are invented', 'mock'],
  ];
  const rowsOf = list => list.map(([k, v, t]) => `<tr><td style="font-weight:500;white-space:nowrap">${k}</td><td style="color:var(--t2)">${v}</td><td class="r"><span class="chip ${t === 'real' ? 'real' : 'mock'}">${t === 'real' ? 'REAL' : 'MOCKED'}</span></td></tr>`).join('');
  main.innerHTML = `
    <div class="mono-label">MVP TRANSPARENCY</div>
    <h1 style="margin-top:8px">Data & Methodology</h1>
    <p class="narrative" style="font-size:14px">This MVP runs on the real HubSpot renewal-pipeline export
      (<code>${esc(D.generatedFrom)}</code>, ${D.deals.length} deals) fused with a deterministic synthetic layer standing in
      for the Gong, support, and human-input integrations that production will provide. The product is framed around one
      job: <b>keep leadership informed about renewals coming up in the next ~90 days</b> by surfacing sentiment from two
      streams — programmatic <b>Gong</b> call analysis and <b>human</b> post-meeting input from CSMs. Everything tagged
      <span class="chip mock">MOCKED</span> in the app links back here. The mock date is <b>${fdateY(D.mockToday)}</b>;
      the fiscal year starts Feb 1 (current quarter: ${D.fq.label}, week ${D.fq.week} of ${D.fq.weeks}).</p>

    <div class="card method-card">
      <h2>Sentiment model — combined, Gong + human</h2>
      <p>Each account carries a <b>combined sentiment score (0–100, 50 = neutral)</b> made up of at least two sub-scores,
         each shown on its own beneath it:</p>
      <div class="formula">
        COMBINED = blend( GONG , HUMAN )&nbsp;&nbsp;// placeholder — exact weighting deliberately deferred<br><br>
        GONG &nbsp;= programmatic call analysis — signal severities (−3…+2) over the last 90 days, recency-weighted<br>
        HUMAN = CSM post-meeting input — meeting type · sentiment (pos/neu/neg) · flag-to-leadership<br><br>
        label: ≥ 60 → POSITIVE · 45–59 → NEUTRAL · &lt; 45 → NEGATIVE&nbsp;&nbsp;·&nbsp;&nbsp;trend = six 15-day buckets, fused
      </div>
      <p>The blend is intentionally a stand-in for future state — the point is to show <b>one score composed of a Gong score
         and a human score</b>, each visible independently. The 90-day sparkline fuses both streams. The <b>Flagged for
         leadership</b> queue surfaces explicit CSM flags first, then sharply-negative automated sentiment on renewals due
         within 90 days. <b>Human input is display-only here</b> — it represents what CSMs submit in the source system after
         a meeting; there is no capture form in this prototype.</p>
    </div>

    <div class="card method-card">
      <h2>Decision layer — from "informed" to "deciding" (v4.1)</h2>
      <p>Sentiment tells leadership <i>how a call felt</i>. It does not tell them <i>what to do</i>. v4.1 adds the fields a CSM
         would submit post-meeting that turn a status board into a decision board — surfaced on the flag cards, in the account
         drawer, and (for confidence) on the sentiment board:</p>
      <div class="formula">
        RENEWAL CONFIDENCE = CSM gut read on the outcome — will renew / likely / at risk / likely churn<br>
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;deliberately distinct from call sentiment (a calm call can still be a churn)<br>
        CHAMPION READ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= strong / wobbling / gone<br>
        TIER &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= escalate (alarm) · watch ("a little off — context, not an alarm") · none<br>
        THE ASK &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= need (air-cover / pricing / roadmap / intro / escalation) · owner · by-when
      </div>
      <p>The <b>watch tier</b> answers Booie's nuance directly: a place to say "this was a little off, context for later" without
         pulling the full alarm — it renders in a separate "On the radar" strip, not the leadership flag queue. <b>The ask</b>
         is the piece v4 was missing entirely: every escalation now carries an explicit need, an owner, and a deadline, so a
         leader moves straight to a decision instead of re-deriving one from the evidence.</p>
    </div>

    <div class="card method-card">
      <h2>Risk score — exact calculation</h2>
      <p>Each account with an open renewal gets four components, each normalized 0–100, blended with fixed weights.
         Accounts with no open deal and no signals are <b>unscored</b>.</p>
      <div class="formula">
        score = 0.40 × GONG + 0.25 × ENGAGEMENT + 0.20 × HYGIENE + 0.15 × SUPPORT<br><br>
        GONG &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= clamp( −Σ severity × recencyMult × 12.5, 0, 100 )<br>
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;signals from last 90d; severity −3…+2; recencyMult = 2 if ≤14d old, else 1<br>
        ENGAGEMENT = days since last touch: ≤14d → 0 · 15–30d → 40 · 31–45d → 70 · &gt;45d → 100<br>
        HYGIENE &nbsp;&nbsp;= past-due +70 · close-date slip +40 · early stage (Retain/Revalidate) closing ≤30d +50<br>
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;· Renewal Intent closing ≤14d +30 · capped at 100<br>
        SUPPORT &nbsp;&nbsp;= escalations(90d) × 35 + open tickets × 12, capped at 100<br><br>
        thresholds: score ≥ 65 → RED · 40–64 → AMBER · &lt; 40 → GREEN
      </div>
      <p><b>Worked example — Amberlyn Wellness Group (${am.riskScore}, ${am.riskLevel}):</b>
        GONG ${c.gong} (CFO budget concern 3d ago ×2, champion change, negative sentiment → weighted −10, capped),
        ENGAGEMENT ${c.engagement} (16 days since last touch), HYGIENE ${c.hygiene} (2-Revalidate stage closing within 30 days),
        SUPPORT ${c.support} (1 escalation + 3 tickets). 0.40×${c.gong} + 0.25×${c.engagement} + 0.20×${c.hygiene} + 0.15×${c.support} = <b>${am.riskScore}</b>.</p>
      <p>Production swaps the mocked inputs for live Gong and support feeds — the formula and the UI stay identical.</p>
    </div>

    <div class="card method-card">
      <h2>What's real</h2>
      <table style="margin-top:6px"><tbody>${rowsOf(real)}</tbody></table>
    </div>
    <div class="card method-card">
      <h2>What's mocked (deterministic — same on every load)</h2>
      <table style="margin-top:6px"><tbody>${rowsOf(mocked)}</tbody></table>
      <p>The synthetic layer is seeded from HubSpot record IDs, so it is stable across reloads, and several story
         moments are seeded on purpose: Amberlyn Wellness Group flipping red before a $139K close with a CFO budget concern flagged to
         leadership, a risk-concentrated book under one CSM, negative sentiment trends on the largest ≤90-day renewals,
         and six close-date slips logged this week.</p>
    </div>`;
}
SCREENS.methodology = renderMethodology;

/* mock tags navigate to methodology */
document.addEventListener('click', e => {
  const tag = e.target.closest('.chip.mock');
  if (tag) navigate('methodology');
});

/* ---------- boot ---------- */
console.assert(D.reconcile.open === openDeals.length, 'open-deal reconciliation failed');
console.log('CS Command Center prototype — reconcile:', D.reconcile, '| accounts:', D.accounts.length, '| signals:', D.signals.length, '| meetings:', D.meetings.length);
navigate(['briefing', 'performance', 'signals', 'methodology'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'briefing');

</script>
</body>
</html>
